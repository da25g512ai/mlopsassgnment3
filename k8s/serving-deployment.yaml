apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model-serving
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      containers:
      - name: mlops-serve
        image: mlops-serve:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
          initialDelaySeconds: 15
        volumeMounts:
        - name: data-volume
          mountPath: /app/checkpoints
          subPath: checkpoints
          readOnly: true
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: ml-data-pvc