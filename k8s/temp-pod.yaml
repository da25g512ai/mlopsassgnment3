apiVersion: v1
kind: Pod
metadata:
  name: data-loader
  namespace: ml-training
spec:
  containers:
  - name: loader
    image: busybox
    command: ['sleep', '3600']
    volumeMounts:
    - name: data-volume
      mountPath: /app/data
      subPath: data
  volumes:
  - name: data-volume
    persistentVolumeClaim:
      claimName: ml-data-pvc
